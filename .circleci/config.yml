version: 2.1

jobs:
  say-hello:
    docker:
      - image: cimg/base:current

    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"

  check-branch-status:
    docker:
      - image: cimg/base:current
    
    steps:
      - checkout
      - run:
          name: "Install jq"
          command: |
            sudo apt-get update
            sudo apt-get install -y jq
      - run:
          name: "Get task token from socket"
          command: |
            TASK_TOKEN_SOCKET="/tmp/circleci-ts.sock"
            MAX_RETRIES=5
            RETRY_DELAY=2
            
            # Wait for socket to be available
            for i in $(seq 1 $MAX_RETRIES); do
              if [ -S "$TASK_TOKEN_SOCKET" ]; then
                echo "Socket found on attempt $i"
                break
              else
                echo "Socket not found, waiting ${RETRY_DELAY}s (attempt $i/$MAX_RETRIES)..."
                if [ $i -lt $MAX_RETRIES ]; then
                  sleep $RETRY_DELAY
                else
                  echo "ERROR: Task token socket not found at $TASK_TOKEN_SOCKET after $MAX_RETRIES attempts"
                  exit 1
                fi
              fi
            done
            
            # Retry getting token from socket
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Attempting to get token from socket (attempt $i/$MAX_RETRIES)..."
              SOCKET_RESPONSE=$(echo "get_token" | nc -U "$TASK_TOKEN_SOCKET" 2>/dev/null)
              
              if [ -n "$SOCKET_RESPONSE" ]; then
                if echo "$SOCKET_RESPONSE" | jq empty 2>/dev/null; then
                  TASK_TOKEN=$(echo "$SOCKET_RESPONSE" | jq -r '.token')
                  
                  if [ -n "$TASK_TOKEN" ] && [ "$TASK_TOKEN" != "null" ]; then
                    echo "Task token obtained successfully on attempt $i"
                    echo "TASK_TOKEN=$TASK_TOKEN" >> $BASH_ENV
                    exit 0
                  else
                    echo "No valid token in response on attempt $i"
                  fi
                else
                  echo "Invalid JSON response on attempt $i: $SOCKET_RESPONSE"
                fi
              else
                echo "No response from socket on attempt $i"
              fi
              
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            done
            
            echo "ERROR: Failed to get task token after $MAX_RETRIES attempts"
            exit 1      
      - run:
          name: "Exchange task token for CircleCI token"
          command: |
            echo "Exchanging task token for CircleCI token..."
            CIRCLE_TOKEN_RESPONSE=$(curl -s -X POST \
              -H "Authorization: bearer $TASK_TOKEN" \
              "https://circleci.com/api/v2/user/access-token")
            
            if ! echo "$CIRCLE_TOKEN_RESPONSE" | jq empty 2>/dev/null; then
              echo "ERROR: Failed to exchange task token for token"
              echo "Response: $CIRCLE_TOKEN_RESPONSE"
              exit 1
            fi
            
            CIRCLE_TOKEN=$(echo "$CIRCLE_TOKEN_RESPONSE" | jq -r '.token')
            
            if [ -z "$CIRCLE_TOKEN" ] || [ "$CIRCLE_TOKEN" = "null" ]; then
              echo "ERROR: Invalid CircleCI token in response"
              exit 1
            fi
            
            echo "CircleCI token obtained"
            echo "CIRCLE_TOKEN=$CIRCLE_TOKEN" >> $BASH_ENV
      - run:
          name: "Test API access - List user role types"
          command: |
            echo "Testing access to list user roles..."
            ROLE_LIST_RESP=$(curl -s -H "Circle-Token: $CIRCLE_TOKEN" \
              "https://bff.circleci.com/private/ciam/all-roles")
            
            if ! echo "$ROLE_LIST_RESP" | jq empty 2>/dev/null; then
              echo "ERROR: Failed to get roles - invalid JSON response"
              echo "Response: $ROLE_LIST_RESP"
              exit 1
            fi
            
            if echo "$ROLE_LIST_RESP" | jq -e '.message' > /dev/null 2>&1; then
              ERROR_MSG=$(echo "$ROLE_LIST_RESP" | jq -r '.message')
              echo "ERROR: API returned error message: $ERROR_MSG"
              exit 1
            fi
            
            if echo "$ROLE_LIST_RESP" | jq -e '.roles' > /dev/null 2>&1; then
              ROLE_COUNT=$(echo "$ROLE_LIST_RESP" | jq '.roles | length' 2>/dev/null || echo "0")
              echo "[SUCCESS] Successfully accessed roles endpoint - found $ROLE_COUNT roles"
              
              if [ "$ROLE_COUNT" -gt 0 ]; then
                echo "Listing available role types:"
                echo "$ROLE_LIST_RESP" | jq -r '.roles[] | "  - \(.Role // "Unknown") (\(.Type // "Unknown type"))"'
              else
                echo "No roles found for this user"
              fi
            else
              echo "[SUCCESS] Successfully accessed roles endpoint (no roles array found, but endpoint accessible)"
              echo "Full response:"
              echo "$ROLE_LIST_RESP" | jq .
            fi
      - run:
          name: "Get and check main branch pipeline"
          command: |
            echo "Getting main branch pipeline..."
            MAIN_BRANCH_RESP=$(curl -s -H "Circle-Token: $CIRCLE_TOKEN" \
              "https://circleci.com/api/v2/project/github/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pipeline?branch=main")
            
            if ! echo "$MAIN_BRANCH_RESP" | jq empty 2>/dev/null; then
              echo "API error: $MAIN_BRANCH_RESP"
              exit 1
            fi
                      
            if ! echo "$MAIN_BRANCH_RESP" | jq -e '.items' > /dev/null 2>&1; then
              echo "ERROR: Invalid response format - no items array"
              exit 1
            fi
            
            ITEMS_COUNT=$(echo "$MAIN_BRANCH_RESP" | jq '.items | length' 2>/dev/null || echo "0")
            
            if [ "$ITEMS_COUNT" -eq 0 ]; then
              echo "[SUCCESS] No pipelines found for main branch - treating as clean state"
              exit 0
            fi
            
            LATEST_PIPELINE=$(echo "$MAIN_BRANCH_RESP" | jq -r '.items[0]')
            
            if [ "$LATEST_PIPELINE" = "null" ] || [ -z "$LATEST_PIPELINE" ]; then
              echo "ERROR: Latest pipeline is null or empty"
              exit 1
            fi
            
            PIPELINE_STATE=$(echo "$LATEST_PIPELINE" | jq -r '.state')
            PIPELINE_ID=$(echo "$LATEST_PIPELINE" | jq -r '.id')
            
            echo "Latest main pipeline: $PIPELINE_ID - State: $PIPELINE_STATE"
            
            if [ -z "$PIPELINE_STATE" ] || [ "$PIPELINE_STATE" = "null" ]; then
              echo "ERROR: Pipeline state is empty or null"
              exit 1
            fi
            
            if [ "$PIPELINE_STATE" = "success" ] || [ "$PIPELINE_STATE" = "created" ]; then
              echo "[SUCCESS] Latest main branch pipeline passed!"
            else
              echo "[FAILED] Latest main branch pipeline failed: $PIPELINE_STATE"
              exit 1
            fi
      - run:
          name: "Trigger custom pipeline"
          command: |
            echo "Triggering custom pipeline via CircleCI API..."
                      
            REQUEST_BODY=$(cat \<<EOF
            {
              "branch": "main"
            }
            EOF
            )
            
            TRIGGER_RESP=$(curl -s -X POST \
              -H "Circle-Token: $CIRCLE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$REQUEST_BODY" \
              "https://circleci.com/api/v2/project/github/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pipeline")
            
            if ! echo "$TRIGGER_RESP" | jq empty 2>/dev/null; then
              echo "ERROR: Failed to trigger pipeline - invalid JSON response"
              echo "Response: $TRIGGER_RESP"
              exit 1
            fi
            
            if echo "$TRIGGER_RESP" | jq -e '.message' > /dev/null 2>&1; then
              ERROR_MSG=$(echo "$TRIGGER_RESP" | jq -r '.message')
              echo "ERROR: API returned error message: $ERROR_MSG"
              echo "Full response: $TRIGGER_RESP"
              exit 1
            fi
            
            TRIGGERED_PIPELINE_ID=$(echo "$TRIGGER_RESP" | jq -r '.id')
            PIPELINE_NUMBER=$(echo "$TRIGGER_RESP" | jq -r '.number')
            PIPELINE_STATE=$(echo "$TRIGGER_RESP" | jq -r '.state')
            
            if [ -z "$TRIGGERED_PIPELINE_ID" ] || [ "$TRIGGERED_PIPELINE_ID" = "null" ]; then
              echo "ERROR: Failed to get pipeline ID from response"
              echo "Response: $TRIGGER_RESP"
              exit 1
            fi
            
            echo "[SUCCESS] Custom pipeline triggered successfully!"
            echo "Pipeline ID: $TRIGGERED_PIPELINE_ID"
            echo "Pipeline Number: $PIPELINE_NUMBER"
            echo "Pipeline State: $PIPELINE_STATE"
            echo "View pipeline at: https://app.circleci.com/pipelines/github/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/$PIPELINE_NUMBER"
      - run:
          name: "Test API access - List user role types"
          command: |
            echo "Testing access to list user roles..."
            ROLE_LIST_RESP=$(curl -s -H "Circle-Token: $CIRCLE_TOKEN" \
              "https://bff.circleci.com/private/ciam/all-roles")
            
            if ! echo "$ROLE_LIST_RESP" | jq empty 2>/dev/null; then
              echo "ERROR: Failed to get roles - invalid JSON response"
              echo "Response: $ROLE_LIST_RESP"
              exit 1
            fi
            
            if echo "$ROLE_LIST_RESP" | jq -e '.message' > /dev/null 2>&1; then
              ERROR_MSG=$(echo "$ROLE_LIST_RESP" | jq -r '.message')
              echo "ERROR: API returned error message: $ERROR_MSG"
              exit 1
            fi
            
            if echo "$ROLE_LIST_RESP" | jq -e '.roles' > /dev/null 2>&1; then
              ROLE_COUNT=$(echo "$ROLE_LIST_RESP" | jq '.roles | length' 2>/dev/null || echo "0")
              echo "[SUCCESS] Successfully accessed roles endpoint - found $ROLE_COUNT roles"
              
              if [ "$ROLE_COUNT" -gt 0 ]; then
                echo "Listing available role types:"
                echo "$ROLE_LIST_RESP" | jq -r '.roles[] | "  - \(.Role // "Unknown") (\(.Type // "Unknown type"))"'
              else
                echo "No roles found for this user"
              fi
            else
              echo "[SUCCESS] Successfully accessed roles endpoint (no roles array found, but endpoint accessible)"
              echo "Full response:"
              echo "$ROLE_LIST_RESP" | jq .
            fi      

workflows:
  main-pipeline-check:
    jobs:
      - check-branch-status
      - say-hello:
          requires:
            - check-branch-status